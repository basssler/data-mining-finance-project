<svg xmlns="http://www.w3.org/2000/svg" width="980" height="245" viewBox="0 0 980 245">
  <style>.h{font:700 28px Arial;fill:#0B1F3A}.t{font:700 21px Arial;fill:#0B1F3A}.s{font:18px Arial;fill:#334E68}.train{fill:#2563EB}.purge{fill:#D97706}.val{fill:#059669}.hold{fill:#0B1F3A}</style>
  <rect width="980" height="245" rx="22" fill="#F8FAFC"/>
  <text class="h" x="490" y="38" text-anchor="middle">Purged Expanding-Window Validation</text>
  <g transform="translate(65 74)">
    <text class="t" x="0" y="25">CV Fold</text>
    <rect class="train" x="126" y="5" width="450" height="30" rx="6"/>
    <rect class="purge" x="592" y="5" width="90" height="30" rx="6"/>
    <rect class="val" x="698" y="5" width="150" height="30" rx="6"/>
