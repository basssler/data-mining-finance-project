panel:
  path: outputs/quarterly/panels/quarterly_event_panel_sector_sentiment_capitaliq.parquet
  name: capitaliq_ablation_sentiment_means_only
prices:
  path: data/interim/prices/prices_with_labels.parquet
label:
  variant_name: event_v2_63d_sign
  horizon_days: 63
  mode: sign
  benchmark_mode: sector_equal_weight_ex_self
holdout:
  start: '2024-01-01'
cv:
  n_splits: 5
  embargo_days: 5
  min_train_dates: 252
models:
- logistic_regression
- random_forest
- xgboost
feature_inclusions:
  additional:
  - sent_mean_7d
  - sent_mean_30d
  - sent_mean_63d
feature_exclusions:
  explicit:
  - gross_margin
  - current_filing_sentiment_available
  - rel_return_5d
  - rel_return_10d
  - overnight_gap_1d
  - abs_return_shock_1d
  - volume_ratio_20d
  - log_volume
  - abnormal_volume_flag
  - sec_sentiment_score
  - sec_positive_prob
  - sec_negative_prob
  - sec_neutral_prob
  - sec_sentiment_abs
  - sec_sentiment_change_prev
  - sec_positive_change_prev
  - sec_negative_change_prev
  - sec_chunk_count
  - sec_log_chunk_count
  auto_drop_all_missing: true
  auto_drop_constant: true
  max_missingness_pct: 20.0
xgboost:
  prefer_gpu_if_clean: true
  fallback_to_cpu: true
random_seed:
  python: 42
  numpy: 42
  sklearn: 42
  xgboost: 42
promotion:
  strategy: stability_aware
metadata:
  report_title: 'Capital IQ Sentiment Ablation: sentiment_means_only'
  label_description: 63-trading-day excess return sign
  panel_display_name: capitaliq_ablation_sentiment_means_only
  setup_note: Quarterly core plus medium-horizon market context control run on the
    Capital IQ-enriched panel with sentiment columns excluded.
  interpretation_note: Use this as the primary non-sentiment control for Capital IQ
    Key Developments sentiment lift.
  experiment_family: capitaliq_ablation_sentiment_means_only
  design_note: capitaliq_sentiment_ablation_sentiment_means_only
outputs:
  csv: outputs/quarterly/modeling/capitaliq_ablation_sentiment_means_only.csv
  markdown: outputs/quarterly/modeling/capitaliq_ablation_sentiment_means_only.md
  shap_plot: outputs/quarterly/modeling/capitaliq_ablation_sentiment_means_only_shap_summary.png
  shap_csv: outputs/quarterly/modeling/capitaliq_ablation_sentiment_means_only_shap_importance.csv
  validation_dir: outputs/quarterly/validation/capitaliq_ablation_sentiment_means_only
